<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3B2F24">
<title>历史资料智能抓取平台</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header id="topbar" class="hidden">
  <div class="tb-inner">
    <div class="brand">
      <span class="seal">档</span>
      <span>历史资料<span class="sub" style="font-size:11px">智能抓取平台</span></span>
    </div>
    <nav class="nav">
      <span class="nav-item on" data-page="crawl" onclick="App.go('crawl')">抓取</span>
      <span class="nav-item" data-page="library" onclick="App.go('library')">资料库</span>
      <span class="nav-item" data-page="settings" onclick="App.go('settings')">设置</span>
    </nav>
  </div>
</header>

<main id="view"></main>

<div id="page-login" class="hidden">
  <div class="card login-card">
    <div class="seal">档</div>
    <h1 id="login-title">输入访问口令</h1>
    <div class="sub" id="login-sub">本平台数据仅供个人学术研究使用</div>
    <input type="password" id="pw-input" placeholder="访问口令" style="text-align:center;letter-spacing:4px">
    <div class="row mt" style="justify-content:center">
      <button class="btn btn-primary" id="pw-btn" onclick="Auth.submit()">进入平台</button>
      <button class="btn btn-plain hidden" id="pw-skip" onclick="Auth.skip()">暂不设置</button>
    </div>
    <div class="muted mt" id="pw-msg" style="color:var(--cinnabar)"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
